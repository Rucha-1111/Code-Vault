# ----------------------------------------------------
# Server
# ----------------------------------------------------
server.port=8080

# ----------------------------------------------------
# MySQL Database
# Create the database first:  CREATE DATABASE github_collections;
# ----------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/github_collections?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate will create the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------
# JWT
# ----------------------------------------------------
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456
app.jwt.expiration-ms=86400000

# ----------------------------------------------------
# GitHub API
# Optional: add a personal access token to raise the GitHub API rate limit
# (unauthenticated requests are limited to 60/hour)
# ----------------------------------------------------
github.api.base-url=https://api.github.com

# ----------------------------------------------------
# CORS - the React dev server
# ----------------------------------------------------
app.cors.allowed-origin=http://localhost:5173
